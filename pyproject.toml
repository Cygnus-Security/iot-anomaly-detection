[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iot-anomaly-detection"
version = "0.1.0"
description = "Authenticated MQTT IoT traffic simulation and collection research prototype"
requires-python = ">=3.11"
dependencies = [
  "pandas==3.1.1",
  "paho-mqtt==2.1.0",
  "streamlit==1.67.0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.5",
  "pytest-cov==6.0.0",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = [
  "integration: requires a running authenticated MQTT broker",
]
